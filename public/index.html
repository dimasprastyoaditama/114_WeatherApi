<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>Dimas Prastyo Aditama : </h3>
    <h3>20240140114: </h3>

    <p>
        kota :
        <span id="lokasi"></span>
    </p>

    <hr>

    <p>
        Koordinat :
        <span id="negara"></span>
    </p>

    <script>

        fetch("/api/lokasi")
            .then((response) => response.json())
            .then((data) => {
                
                console.log(data);

                document.getElementById("lokasi").innerHTML = data.kota;

                document.getElementById("negara").innerHTML = data.koordinat;

            })
            .catch((error) => {
                console.error(Error);

            });

    </script>

</body>
</html>
